*,

body {

  height: 100%;
  overflow: hidden;

/* ===== ตัวเลขในกรอบ (ตำแหน่งคงที่ ตรงกลางกรอบ) ===== */
.value {
  position: absolute;
  left: var(--x);
  top: 389px;
  width: 207px;
  height: 192px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 76px;
  font-weight: 800;
  line-height: 1;
  color: #000;
  font-variant-numeric: tabular-nums;
  transition: opacity 0.35s ease, transform 0.35s ease, color 0.35s ease;
  pointer-events: none;
}

.value.off {
  opacity: 0.45;
}

.value.pop {
  animation: pop 0.45s ease;
}

@keyframes pop {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.12); }
  100% { transform: scale(1); }
}

/* ===== Toggle ===== */
.toggle {
  --track-w: 188px;
  --track-h: 59px;
  --knob: 54px;
  --pad: 8px;

  position: absolute;
  left: var(--x);
  top: 678px;
  width: var(--track-w);
  height: var(--track-h);
  border: 0;
  border-radius: 999px;
  background: #c8d0da;
  cursor: pointer;
  outline: none;
  box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.12);
  transition: background-color 0.3s ease, box-shadow 0.3s ease;
}

.toggle::after {
  content: "";
  position: absolute;
  left: var(--pad);
  top: calc((var(--track-h) - var(--knob)) / 2);
  width: var(--knob);
  height: var(--knob);
  border-radius: 50%;
  background: #b3b3b3;
  border: 4px solid #000;
  box-shadow: 0 3px 6px rgba(0, 0, 0, 0.25);
  transition: transform 0.35s cubic-bezier(0.34, 1.4, 0.64, 1),
              background-color 0.3s ease;
}

.toggle:hover::after {
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
}

.toggle:active::after {
  width: calc(var(--knob) + 6px);
}

.toggle:focus-visible {
  box-shadow: 0 0 0 5px rgba(255, 127, 102, 0.55);
}

/* สถานะเปิด */
.toggle[aria-checked="true"] {
  background: #86b049;
  box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.2), 0 0 18px rgba(134, 176, 73, 0.55);
}

.toggle[aria-checked="true"]::after {
  background: #ffffff;
  transform: translateX(calc(var(--track-w) - var(--knob) - var(--pad) * 2));
}

.toggle[aria-checked="true"]:active::after {
  transform: translateX(calc(var(--track-w) - var(--knob) - var(--pad) * 2 - 6px));
}

</style>
</head>
<body>
  <h1 class="sr-only">Farm IoT</h1>

  <!-- เวทีขนาด 1920x1080 ปรับสเกลตามหน้าจอ เพื่อให้ตัวเลข/ปุ่มตรงกับกรอบในพื้นหลังเสมอ -->
  <main class="stage" id="stage">

    <!-- อุณหภูมิ -->
    <div class="value" id="value-temp" style="--x:426px">0</div>
    <button class="toggle" id="toggle-temp" role="switch" aria-checked="false"
            aria-label="เปิด/ปิด อุณหภูมิ" data-target="temp" style="--x:436px"></button>

    <!-- ความชื้น -->
    <div class="value" id="value-humidity" style="--x:746px">0</div>
    <button class="toggle" id="toggle-humidity" role="switch" aria-checked="false"
            aria-label="เปิด/ปิด ความชื้น" data-target="humidity" style="--x:756px"></button>

    <!-- ค่าแสง -->
    <div class="value" id="value-light" style="--x:1041px">0</div>
    <button class="toggle" id="toggle-light" role="switch" aria-checked="false"
            aria-label="เปิด/ปิด ค่าแสง" data-target="light" style="--x:1054px"></button>

    <!-- ระดับน้ำ -->
    <div class="value" id="value-water" style="--x:1323px">0</div>
    <button class="toggle" id="toggle-water" role="switch" aria-checked="false"
            aria-label="เปิด/ปิด ระดับน้ำ" data-target="water" style="--x:1348px"></button>

  </main>

  <script>
(() => {
  "use strict";

  const STAGE_W = 1920;
  const STAGE_H = 1080;
  const UPDATE_MS = 2000; // รอบการสุ่มค่าใหม่ (เมื่อเปิด toggle)

  /* ===== ตั้งค่าเซนเซอร์: ช่วงค่าที่สุ่ม ===== */
  const sensors = {
    temp:     { min: 24, max: 38,  value: 0, timer: null },  // อุณหภูมิ (°C)
    humidity: { min: 40, max: 95,  value: 0, timer: null },  // ความชื้น (%)
    light:    { min: 100, max: 999, value: 0, timer: null }, // ค่าแสง (lux)
    water:    { min: 10, max: 100, value: 0, timer: null },  // ระดับน้ำ (%)
  };

  const stage = document.getElementById("stage");

  /* ===== ปรับสเกลเวทีให้เต็มจอ (แบบ cover) โดยไม่ให้ส่วนตัวเลข/ปุ่มถูกตัด ===== */
  function fitStage() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const cover = Math.max(vw / STAGE_W, vh / STAGE_H);
    const safe = Math.min(vw / 1200, vh / 720); // พื้นที่ส่วนเนื้อหาหลักต้องอยู่ในจอ
    const scale = Math.min(cover, safe);
    stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }

  /* ===== ตัวช่วย ===== */
  const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

  // สุ่มค่าใหม่ที่ไม่ซ้ำค่าเดิม
  function nextValue(s) {
    let v;
    do { v = rand(s.min, s.max); } while (v === s.value);
    return v;
  }

  // แอนิเมชันนับตัวเลขจากค่าเก่าไปค่าใหม่
  function animateNumber(el, from, to, duration = 600) {
    const start = performance.now();
    function frame(now) {
      const t = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - t, 3);
      el.textContent = Math.round(from + (to - from) * eased);
      if (t < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function updateSensor(key) {
    const s = sensors[key];
    const el = document.getElementById(`value-${key}`);
    const newVal = nextValue(s);
    animateNumber(el, s.value, newVal);
    s.value = newVal;

    el.classList.remove("pop");
    void el.offsetWidth; // รีสตาร์ทแอนิเมชัน
    el.classList.add("pop");
  }

  function setToggle(btn, on) {
    const key = btn.dataset.target;
    const s = sensors[key];
    const el = document.getElementById(`value-${key}`);

    btn.setAttribute("aria-checked", String(on));
    el.classList.toggle("off", !on);

    clearInterval(s.timer);
    s.timer = null;

    if (on) {
      updateSensor(key); // สุ่มทันทีที่เปิด
      s.timer = setInterval(() => updateSensor(key), UPDATE_MS);
    }
  }

  /* ===== เริ่มต้น ===== */
  function init() {
    fitStage();
    window.addEventListener("resize", fitStage);

    document.querySelectorAll(".toggle").forEach((btn) => {
      const key = btn.dataset.target;
      const s = sensors[key];
      const el = document.getElementById(`value-${key}`);

      // ค่าเริ่มต้นแบบสุ่ม (สถานะปิด)
      s.value = rand(s.min, s.max);
      el.textContent = s.value;
      el.classList.add("off");

      btn.addEventListener("click", () => {
        setToggle(btn, btn.getAttribute("aria-checked") !== "true");
      });
    });
  }

  init();
})();

</script>
</body>
</html>
